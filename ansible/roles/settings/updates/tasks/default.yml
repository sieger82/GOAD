- name: Enable update service
  ansible.windows.win_service:
    name: Windows Update
    state: started
    start_mode: auto


- name: Check for available updates
  ansible.windows.win_updates:
    category_names: '*'
    state: installed
    reboot: true
  register: update_result
  until: update_result.found_update_count == 0
  retries: 3
  delay: 10